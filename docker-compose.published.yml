# Society Deployment - Docker Compose (Published Images)
# For production society deployments using published images from Docker Hub
# (Federation has separate docker-compose.federation.yml)

services:
  reverse-proxy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bfs-network
    restart: unless-stopped

  governance:
    image: ${DOCKER_USERNAME:-cirodam}/ben-franklin-society-governance:${VERSION:-latest}
    environment:
      DATABASE_PATH: /app/data/governance.db
      DOCUMENTS_PATH: /app/data/documents
      PUBLIC_URL: ${GOVERNANCE_URL:-https://governance.bfs.example.com}
      NODE_ENV: production
      PORT: 5173
      OIDC_PRIVATE_KEY: ${OIDC_PRIVATE_KEY}
      # Satellite app URLs for OIDC client registration
      BANK_URL: ${BANK_URL:-https://bank.bfs.example.com}
      MAIL_URL: ${MAIL_URL:-https://mail.bfs.example.com}
      MARKETPLACE_URL: ${MARKETPLACE_URL:-https://marketplace.bfs.example.com}
      LIBRARY_URL: ${LIBRARY_URL:-https://library.bfs.example.com}
      # Internal service-to-service communication
      COMMUNITY_BANK_URL: http://community-bank:5174
      GOVERNANCE_SHARED_SECRET: ${GOVERNANCE_SHARED_SECRET}
    volumes:
      - governance-data:/app/data
    networks:
      - bfs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  community-bank:
    image: ${DOCKER_USERNAME:-cirodam}/ben-franklin-society-community-bank:${VERSION:-latest}
    environment:
      DATABASE_PATH: /app/data/bank.db
      GOVERNANCE_URL: ${GOVERNANCE_URL:-https://governance.bfs.example.com}
      PUBLIC_URL: ${BANK_URL:-https://bank.bfs.example.com}
      OIDC_CLIENT_ID: community-bank
      OIDC_CLIENT_SECRET: ${BANK_OIDC_SECRET}
      GOVERNANCE_SHARED_SECRET: ${GOVERNANCE_SHARED_SECRET}
      NODE_ENV: production
      PORT: 5174
    volumes:
      - community-bank-data:/app/data
    networks:
      - bfs-network
    depends_on:
      - governance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5174/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mail:
    image: ${DOCKER_USERNAME:-cirodam}/ben-franklin-society-mail:${VERSION:-latest}
    environment:
      DATABASE_PATH: /app/data/mail.db
      GOVERNANCE_URL: ${GOVERNANCE_URL:-https://governance.bfs.example.com}
      PUBLIC_URL: ${MAIL_URL:-https://mail.bfs.example.com}
      OIDC_CLIENT_ID: mail
      OIDC_CLIENT_SECRET: ${MAIL_OIDC_SECRET}
      NODE_ENV: production
      PORT: 5175
    volumes:
      - mail-data:/app/data
    networks:
      - bfs-network
    depends_on:
      - governance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5175/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  marketplace:
    image: ${DOCKER_USERNAME:-cirodam}/ben-franklin-society-marketplace:${VERSION:-latest}
    environment:
      DATABASE_PATH: /app/data/marketplace.db
      GOVERNANCE_URL: ${GOVERNANCE_URL:-https://governance.bfs.example.com}
      PUBLIC_URL: ${MARKETPLACE_URL:-https://marketplace.bfs.example.com}
      OIDC_CLIENT_ID: marketplace
      OIDC_CLIENT_SECRET: ${MARKETPLACE_OIDC_SECRET}
      NODE_ENV: production
      PORT: 5176
    volumes:
      - marketplace-data:/app/data
    networks:
      - bfs-network
    depends_on:
      - governance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5176/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  library:
    image: ${DOCKER_USERNAME:-cirodam}/ben-franklin-society-library:${VERSION:-latest}
    environment:
      DATABASE_PATH: /app/data/library.db
      GOVERNANCE_URL: ${GOVERNANCE_URL:-https://governance.bfs.example.com}
      PUBLIC_URL: ${LIBRARY_URL:-https://library.bfs.example.com}
      OIDC_CLIENT_ID: library
      OIDC_CLIENT_SECRET: ${LIBRARY_OIDC_SECRET}
      NODE_ENV: production
      PORT: 5177
    volumes:
      - library-data:/app/data
    networks:
      - bfs-network
    depends_on:
      - governance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5177/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  governance-data:
  community-bank-data:
  mail-data:
  marketplace-data:
  library-data:
  caddy_data:
  caddy_config:

networks:
  bfs-network:
    driver: bridge
