# Docker Compose configuration using published images from Docker Hub
# For production deployments without building from source

services:
  reverse-proxy:
    image: traefik:v3.0
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@bfs.example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - bfs-network
    restart: unless-stopped

  governance:
    image: ${DOCKER_USERNAME:-cirodam}/ben-franklin-society-governance:${VERSION:-latest}
    environment:
      DATABASE_PATH: /app/data/governance.db
      DOCUMENTS_PATH: /app/data/documents
      PUBLIC_URL: ${GOVERNANCE_URL:-https://governance.bfs.example.com}
      NODE_ENV: production
      PORT: 5173
    volumes:
      - governance-data:/app/data
    networks:
      - bfs-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.governance.rule=Host(`${GOVERNANCE_DOMAIN:-governance.bfs.example.com}`)"
      - "traefik.http.routers.governance.entrypoints=websecure"
      - "traefik.http.routers.governance.tls.certresolver=letsencrypt"
      - "traefik.http.services.governance.loadbalancer.server.port=5173"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.governance-http.rule=Host(`${GOVERNANCE_DOMAIN:-governance.bfs.example.com}`)"
      - "traefik.http.routers.governance-http.entrypoints=web"
      - "traefik.http.routers.governance-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  community-bank:
    image: ${DOCKER_USERNAME:-cirodam}/ben-franklin-society-community-bank:${VERSION:-latest}
    environment:
      DATABASE_PATH: /app/data/bank.db
      GOVERNANCE_URL: ${GOVERNANCE_URL:-https://governance.bfs.example.com}
      PUBLIC_URL: ${BANK_URL:-https://bank.bfs.example.com}
      OIDC_CLIENT_ID: community-bank
      OIDC_CLIENT_SECRET: ${BANK_OIDC_SECRET}
      NODE_ENV: production
      PORT: 5174
    volumes:
      - community-bank-data:/app/data
    networks:
      - bfs-network
    depends_on:
      - governance
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bank.rule=Host(`${BANK_DOMAIN:-bank.bfs.example.com}`)"
      - "traefik.http.routers.bank.entrypoints=websecure"
      - "traefik.http.routers.bank.tls.certresolver=letsencrypt"
      - "traefik.http.services.bank.loadbalancer.server.port=5174"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.bank-http.rule=Host(`${BANK_DOMAIN:-bank.bfs.example.com}`)"
      - "traefik.http.routers.bank-http.entrypoints=web"
      - "traefik.http.routers.bank-http.middlewares=redirect-to-https"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5174/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mail:
    image: ${DOCKER_USERNAME:-cirodam}/ben-franklin-society-mail:${VERSION:-latest}
    environment:
      DATABASE_PATH: /app/data/mail.db
      GOVERNANCE_URL: ${GOVERNANCE_URL:-https://governance.bfs.example.com}
      PUBLIC_URL: ${MAIL_URL:-https://mail.bfs.example.com}
      OIDC_CLIENT_ID: mail
      OIDC_CLIENT_SECRET: ${MAIL_OIDC_SECRET}
      NODE_ENV: production
      PORT: 5175
    volumes:
      - mail-data:/app/data
    networks:
      - bfs-network
    depends_on:
      - governance
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mail.rule=Host(`${MAIL_DOMAIN:-mail.bfs.example.com}`)"
      - "traefik.http.routers.mail.entrypoints=websecure"
      - "traefik.http.routers.mail.tls.certresolver=letsencrypt"
      - "traefik.http.services.mail.loadbalancer.server.port=5175"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.mail-http.rule=Host(`${MAIL_DOMAIN:-mail.bfs.example.com}`)"
      - "traefik.http.routers.mail-http.entrypoints=web"
      - "traefik.http.routers.mail-http.middlewares=redirect-to-https"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5175/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  marketplace:
    image: ${DOCKER_USERNAME:-cirodam}/ben-franklin-society-marketplace:${VERSION:-latest}
    environment:
      DATABASE_PATH: /app/data/marketplace.db
      GOVERNANCE_URL: ${GOVERNANCE_URL:-https://governance.bfs.example.com}
      PUBLIC_URL: ${MARKETPLACE_URL:-https://marketplace.bfs.example.com}
      OIDC_CLIENT_ID: marketplace
      OIDC_CLIENT_SECRET: ${MARKETPLACE_OIDC_SECRET}
      NODE_ENV: production
      PORT: 5176
    volumes:
      - marketplace-data:/app/data
    networks:
      - bfs-network
    depends_on:
      - governance
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.marketplace.rule=Host(`${MARKETPLACE_DOMAIN:-marketplace.bfs.example.com}`)"
      - "traefik.http.routers.marketplace.entrypoints=websecure"
      - "traefik.http.routers.marketplace.tls.certresolver=letsencrypt"
      - "traefik.http.services.marketplace.loadbalancer.server.port=5176"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.marketplace-http.rule=Host(`${MARKETPLACE_DOMAIN:-marketplace.bfs.example.com}`)"
      - "traefik.http.routers.marketplace-http.entrypoints=web"
      - "traefik.http.routers.marketplace-http.middlewares=redirect-to-https"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5176/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  library:
    image: ${DOCKER_USERNAME:-cirodam}/ben-franklin-society-library:${VERSION:-latest}
    environment:
      DATABASE_PATH: /app/data/library.db
      GOVERNANCE_URL: ${GOVERNANCE_URL:-https://governance.bfs.example.com}
      PUBLIC_URL: ${LIBRARY_URL:-https://library.bfs.example.com}
      OIDC_CLIENT_ID: library
      OIDC_CLIENT_SECRET: ${LIBRARY_OIDC_SECRET}
